<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Alunos</title>
 
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
 
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 350px;
    }
 
    input, select, button {
      padding: 8px;
    }
 
    table {
      margin-top: 20px;
      border-collapse: collapse;
      width: 100%;
    }
 
    th, td {
      border: 1px solid gray;
      padding: 8px;
      text-align: left;
    }
 
    #mensagem {
      color: red;
    }
 
    pre {
      background-color: #eee;
      padding: 10px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
    <h1>Cadastro de Alunos</h1>
    
    <form id="formulario">
        <label for="nome">Nome:  </label>
        <input type="text" id="nome" name="nome" required>
        <label for="email">E-mail:  </label>
        <input type="email" id="email" name="email" required>
        <label for="idade">Idade:  </label>">
        <input type="number" id="idade" name="idade" required>
        <label for="curso">Curso:  </label>
        <select id="curso" name="curso" required>
            <option value="">Selecione um curso</option>
            <option value="Computação">Computação</option>
            <option value="Engenharia">Engenharia</option>
            <option value="Matemática">Matemática</option>
        </select>

        <button type="submit">Cadastrar</button>
    </form>

    <h2>Objeto JSON</h2>
    <pre id="json"></pre>

    <h2>Alunos Cadastrados</h2>
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Idade</th>
                <th>Curso</th>
            </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
    </table>

    <script>
        const formulario = document.getElementById("formulario");
        const saidajson = document.getElementById("json");
        const corpoTabela = document.getElementById("corpoTabela");
        formulario.addEventListener("submit", function(event) {
            event.preventDefault();
            const dados = new FormData(formulario);
            const objeto = {};
            for (const [campo, valor] of dados){
                objeto[campo] = valor;
            }

            saidajson.textContent = JSON.stringify(objeto, null, 2);

            const Linha = corpoTabela.insertRow();
            Linha.insertCell(0).textContent = objeto.nome;
            Linha.insertCell(1).textContent = objeto.email;
            Linha.insertCell(2).textContent = objeto.idade;
            Linha.insertCell(3).textContent = objeto.curso;

            formulario.reset();
        });
        </script>
        
    </body>
</html>
